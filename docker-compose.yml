services:
  mechanic:
    build:
      context: .
      dockerfile: Dockerfile.mechanic
    container_name: pitcrew-mechanic
    # 🗝️ THE FIX: Runs the container as root to bypass Windows/Docker Desktop socket security
    user: root 
    ports:
      - "8000:8000"
    volumes:
      # Mounts the host's Docker engine into the container so 'docker ps' works
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - pitcrew-net

  payment-gateway:
    build:
      context: ./victim-app
      dockerfile: Dockerfile
    container_name: production-payment-gateway
    ports:
      - "5000:5000"
    networks:
      - pitcrew-net

networks:
  pitcrew-net:
    driver: bridge